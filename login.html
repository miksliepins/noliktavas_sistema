<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pieslēgšanās lapa</title>
    <link rel="stylesheet" href="login_style.css">
</head>
<body>
    <form id="login-form" class="ievades_lauki">
        <h3 class="virsraksts">Pierakstīšanās</h3>

        <div class="email_ievade">
            <label for="email_input">Ievadi savu E-pastu</label>
            <input type="email" id="email_input" name="email" required>
        </div>

        <div class="parol_ievade">
            <label for="parole_input">Ievadi savu paroli</label>
            <input type="password" id="parole_input" name="password" required>
        </div>

        <button type="submit" id="pieslegties">Pieslēgties</button>
        <p id="message" class="zinojums" role="status"></p>
        <p class="saite">Nav konta? <a href="registrs.html">Reģistrēties</a></p>
    </form>

    <script src="login.js" defer></script>
</body>
</html>
